[package]
name = "orbitpay-recurring-payments"
version = "0.1.0"
edition = "2021"
publish = false
description = "OrbitPay: Decentralized recurring subscription payments on Stellar Soroban"
authors = ["OrbitPay Contributors"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
